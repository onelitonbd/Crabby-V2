<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#062a3c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Crabby Catch — a one-thumb arcade game for phones and desktop. Single file, works offline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.92em%27 font-size=%2790%27%3E%F0%9F%A6%80%3C/text%3E%3C/svg%3E">
<title>Crabby Catch 🦀</title>
<style>
  /* ---------- base / reset ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#062a3c;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf7ff;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  canvas#game{display:block;position:absolute;inset:0;touch-action:none;cursor:pointer}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);
    display:flex;align-items:flex-start;gap:10px;
    pointer-events:none;
    opacity:0;transition:opacity .25s ease;
  }
  #hud.on{opacity:1}
  .stat{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.5px;line-height:1.05;
        text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35)}
  #score{font-size:clamp(26px,7.2vw,40px);font-variant-numeric:tabular-nums}
  #scoreLabel{font-size:11px;font-weight:700;letter-spacing:2.5px;opacity:.72;margin-top:2px}
  #mid{margin-left:auto;text-align:right;margin-right:4px}
  #level{font-size:13px;font-weight:800;letter-spacing:2px;opacity:.9}
  #combo{margin-top:6px;min-height:18px}
  #comboText{display:inline-block;font-size:15px;font-weight:900;letter-spacing:1px;
    color:#ffe066;text-shadow:0 0 14px rgba(255,190,60,.55);transform-origin:100% 50%}
  #comboBarWrap{width:74px;height:5px;margin-left:auto;margin-top:5px;border-radius:99px;
    background:rgba(255,255,255,.16);overflow:hidden;opacity:0;transition:opacity .2s}
  #comboBarWrap.on{opacity:1}
  #comboBar{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#ffd166,#ff7b54)}
  #lives{font-size:22px;letter-spacing:1px;white-space:nowrap;line-height:1}
  #lives .h{opacity:.22;filter:grayscale(1)}
  #lives .h.live{opacity:1;filter:none;animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}

  #btns{
    position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    display:flex;gap:10px;z-index:4;opacity:0;transition:opacity .25s ease;pointer-events:none
  }
  #btns.on{opacity:1;pointer-events:auto}
  .icon{
    width:52px;height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.22);
    background:rgba(8,38,56,.55);color:#eaf7ff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    touch-action:manipulation;transition:transform .12s ease,background .2s ease
  }
  .icon:active{transform:scale(.92);background:rgba(20,70,100,.8)}

  /* ---------- overlays ---------- */
  #overlay{
    position:absolute;inset:0;z-index:5;display:none;
    align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);
    background:radial-gradient(120% 90% at 50% 0%,rgba(6,42,60,.55),rgba(2,16,26,.9));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y
  }
  #overlay.on{display:flex}
  .panel{
    width:min(460px,100%);max-height:100%;text-align:center;
    background:linear-gradient(180deg,rgba(10,46,68,.92),rgba(4,24,38,.94));
    border:1px solid rgba(255,255,255,.14);border-radius:26px;
    padding:22px 20px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
    animation:rise .32s cubic-bezier(.2,.9,.25,1.1) both
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .kicker{font-size:11px;font-weight:800;letter-spacing:3.5px;opacity:.65;text-transform:uppercase}
  h1{margin:6px 0 2px;font-size:clamp(30px,10.5vw,46px);line-height:.98;letter-spacing:-.5px;
     background:linear-gradient(180deg,#fff7e6,#ffb26b 60%,#ff6b4a);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     filter:drop-shadow(0 4px 12px rgba(255,120,70,.25))}
  h2{margin:8px 0 2px;font-size:clamp(24px,8vw,34px);letter-spacing:-.3px}
  .sub{font-size:14px;opacity:.78;margin:8px 0 0;line-height:1.5}
  .scorebox{margin:16px 0 4px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.1);display:flex;gap:12px;justify-content:space-around}
  .scorebox div{flex:1}
  .scorebox b{display:block;font-size:clamp(22px,7vw,30px);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .scorebox span{font-size:10.5px;letter-spacing:2.2px;opacity:.6;font-weight:700}
  .legend{margin:14px 0 2px;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
  .legend i{display:flex;align-items:center;gap:9px;font-style:normal;font-size:12.5px;line-height:1.25;
            background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:9px 10px}
  .legend em{font-style:normal;font-size:19px;line-height:1}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    min-height:60px;margin-top:12px;border:0;border-radius:20px;cursor:pointer;
    font-family:inherit;font-size:19px;font-weight:900;letter-spacing:1.2px;color:#20120a;
    background:linear-gradient(180deg,#ffe08a,#ffb03a 55%,#ff8a2b);
    box-shadow:0 8px 0 #b45c12,0 14px 26px rgba(0,0,0,.35);
    touch-action:manipulation;transition:transform .09s ease,box-shadow .09s ease
  }
  .btn:active{transform:translateY(5px);box-shadow:0 3px 0 #b45c12,0 8px 16px rgba(0,0,0,.3)}
  .btn.ghost{background:rgba(255,255,255,.08);color:#eaf7ff;border:1px solid rgba(255,255,255,.2);
             box-shadow:none;font-size:16px;min-height:52px;font-weight:800}
  .btn.ghost:active{transform:scale(.97);background:rgba(255,255,255,.14)}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:10px}
  .hint{font-size:12px;opacity:.55;margin-top:14px;line-height:1.5}
  .best{font-size:13px;letter-spacing:1.6px;font-weight:800;opacity:.85;margin-top:10px}
  .best b{color:#ffe066;font-variant-numeric:tabular-nums}
  .newbest{margin-top:10px;font-size:14px;font-weight:900;letter-spacing:1.4px;color:#7CFC9B;
           text-shadow:0 0 16px rgba(80,255,140,.5);animation:pop .5s ease}
  .pd{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;
      background:rgba(2,14,22,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:18px}
  .pd.on{display:flex}
  .pd .panel{width:min(340px,100%)}
  @media (max-height:560px){
    h1{font-size:30px}.legend{grid-template-columns:1fr 1fr}
    .btn{min-height:52px}.panel{padding:16px 16px 14px}
    .sub{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" role="application" aria-label="Crabby Catch — drag anywhere to move the crab and catch falling treasure"></canvas>

  <div id="hud" aria-hidden="true">
    <div>
      <div id="score" class="stat">0</div>
      <div id="scoreLabel">SCORE</div>
    </div>
    <div id="mid">
      <div id="level" class="stat">LEVEL 1</div>
      <div id="combo">
        <span id="comboText"></span>
        <div id="comboBarWrap"><div id="comboBar"></div></div>
      </div>
    </div>
    <div id="lives" class="stat"></div>
  </div>

  <div id="btns">
    <button class="icon" id="btnPause" aria-label="Pause">❚❚</button>
    <button class="icon" id="btnMute" aria-label="Toggle sound">🔊</button>
    <button class="icon" id="btnFull" aria-label="Toggle fullscreen">⛶</button>
  </div>

  <div id="overlay" class="on"><div class="panel" id="panel"></div></div>
  <div class="pd" id="pauseLayer"><div class="panel">
    <div class="kicker">Paused</div>
    <h2>Take a breath 🌊</h2>
    <button class="btn" id="btnResume">RESUME</button>
    <button class="btn ghost" id="btnQuit">QUIT TO MENU</button>
  </div></div>
</div>

<script>
(() => {
'use strict';

/* =========================================================================
   Crabby Catch — a single-file, one-thumb arcade game.
   Mobile first: pointer events (touch/mouse/pen), DPR-aware canvas,
   safe-area aware HUD, pause on background, WebAudio unlocked on gesture.
   ========================================================================= */

/* ------------------------------ geometry / utils ------------------------ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndi  = (a, b) => Math.floor(rnd(a, b + 1));
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;

const $ = id => document.getElementById(id);
const cvs = $('game');
const ctx = cvs.getContext && cvs.getContext('2d', { alpha: false });

if (!ctx) {
  document.body.innerHTML = '<div style="padding:24px;font:16px/1.5 system-ui,sans-serif">' +
    '<h1 style="font-size:22px">Crabby Catch needs a canvas-capable browser 🦀</h1>' +
    '<p>Please open this page in a recent version of Chrome, Safari, Firefox or Edge.</p></div>';
  return;
}

/* ------------------------------ storage (guarded) ----------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
};

/* ------------------------------ audio ----------------------------------- */
let actx = null;
let muted = store.get('crabby.muted', '0') === '1';

function audioInit() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { actx = null; }
}
function audioUnlock() {
  audioInit();
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
}
/** Tiny synth voice. Exponential ramps never touch 0 (WebAudio throws/ignores). */
function tone(o) {
  if (!actx || muted || actx.state !== 'running') return;
  const t0 = actx.currentTime + (o.delay || 0);
  const dur = o.dur || 0.14;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(Math.max(20, o.freq), t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
  const vol = o.vol == null ? 0.18 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function buzz(ms) { if (navigator.vibrate && !muted) { try { navigator.vibrate(ms); } catch (e) {} } }

const SFX = {
  catch(combo) {
    const f = 560 + Math.min(combo, 18) * 26;
    tone({ freq: f, to: f * 1.5, dur: 0.1, type: 'triangle', vol: 0.16 });
  },
  pearl() { [0, 0.07, 0.14].forEach((d, i) => tone({ freq: 780 + i * 260, dur: 0.16, type: 'sine', vol: 0.14, delay: d })); },
  hit() { tone({ freq: 200, to: 70, dur: 0.3, type: 'sawtooth', vol: 0.22 }); },
  shield() { tone({ freq: 320, to: 900, dur: 0.2, type: 'square', vol: 0.12 }); },
  life() { [660, 880, 1180].forEach((f, i) => tone({ freq: f, dur: 0.16, type: 'sine', vol: 0.14, delay: i * 0.07 })); },
  level() { [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: 0.2, type: 'triangle', vol: 0.15, delay: i * 0.085 })); },
  over() { [523, 415, 330, 250].forEach((f, i) => tone({ freq: f, dur: 0.34, type: 'sine', vol: 0.17, delay: i * 0.14 })); },
  tap() { tone({ freq: 420, to: 620, dur: 0.07, type: 'triangle', vol: 0.12 }); }
};

/* ------------------------------ responsive canvas ----------------------- */
let W = 0, H = 0, dpr = 1, S = 1;      // S = global size scale (design unit)
let sandH = 0, crabY = 0;

function resize() {
  const vv = window.visualViewport;
  W = Math.max(240, Math.round((vv && vv.width) || window.innerWidth));
  H = Math.max(320, Math.round((vv && vv.height) || window.innerHeight));
  dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  cvs.width = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = 'high';

  // design scaling: reference device is ~400x700 CSS px
  S = clamp(Math.min(W / 400, H / 690), 0.58, 1.9);
  sandH = Math.round(Math.min(H * 0.15, 96 * S));
  crabY = H - sandH + 6 * S;

  buildSprites();
  makeBackdrop();
  if (game.state === 'menu') resetCrab();
  else crab.x = clamp(crab.x, 0, W);
  crab.y = crabY;
}
const onChange = () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 90); };
window.addEventListener('resize', onChange);
window.addEventListener('orientationchange', () => setTimeout(resize, 260));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onChange);
  window.visualViewport.addEventListener('scroll', () => { window.scrollTo(0, 0); });
}

/* ------------------------------ game state ------------------------------ */
const CFG = {
  startLives: 3, maxLives: 5,
  baseFall: 165,        // px/s at level 1 (scaled by S)
  fallPerLevel: 1.155,
  maxFall: 620,
  baseSpawn: 0.88,      // seconds between spawn waves at level 1
  spawnPerLevel: 0.93,
  minSpawn: 0.34,
  comboTime: 2.5,
  catchesPerLevel: 14,
  maxLevel: 9
};

const game = {
  state: 'menu',        // menu | playing | paused | over
  score: 0, best: parseInt(store.get('crabby.best', '0'), 10) || 0,
  lives: CFG.startLives,
  level: 1,
  combo: 0, comboTimer: 0, bestCombo: 0,
  caught: 0, elapsed: 0,
  spawnTimer: 1.1,
  time: 0,
  shake: 0, flash: 0, flashHue: 'rgba(255,80,80,',
  banner: null,         // {text, t}
  shield: 0,
  slowmo: 0,
  magnet: 0,
  newBest: false
};

const crab = { x: 0, y: 0, tx: 0, vx: 0, w: 0, snap: 0, squash: 0, walk: 0, blink: 0, look: 0, tilt: 0, dead: 0 };
let items = [], pops = [], parts = [], bubbles = [], props = [];

function resetCrab() {
  crab.x = W / 2; crab.tx = W / 2; crab.vx = 0; crab.snap = 0; crab.squash = 0;
  crab.blink = 0; crab.look = 0; crab.tilt = 0; crab.dead = 0;
}

/* ------------------------------ item catalogue -------------------------- */
const TYPES = {
  shell:  { r: 19, good: true,  pts: 10,  label: 'shell' },
  star:   { r: 18, good: true,  pts: 15,  label: 'star' },
  fish:   { r: 20, good: true,  pts: 25,  label: 'fish' },
  pearl:  { r: 15, good: true,  pts: 100, label: 'pearl' },
  bubble: { r: 20, good: true,  power: 'shield', label: 'bubble' },
  heart:  { r: 17, good: true,  power: 'life',   label: 'heart' },
  puffer: { r: 21, good: false, label: 'puffer' },
  junk:   { r: 20, good: false, label: 'junk' }
};

/** Weight table per type — hazards get greedier as the crab dives deeper. */
function weights(level) {
  return {
    shell:  34,
    star:   18,
    fish:   level >= 2 ? 16 : 8,
    pearl:  4 + Math.min(level, 5),
    bubble: level >= 2 ? 5 : 3,
    heart:  level >= 3 ? 2.2 : 1.2,
    puffer: level >= 2 ? 9 + level * 2.4 : 0,
    junk:   level >= 2 ? 8 + level * 2.0 : 0
  };
}
let weightTable = weights(1), weightTotal = 0;
function rebuildWeights() {
  weightTable = weights(game.level);
  weightTotal = 0;
  for (const k in weightTable) weightTotal += weightTable[k];
}
function rollType() {
  let r = Math.random() * weightTotal;
  for (const k in weightTable) { r -= weightTable[k]; if (r <= 0) return k; }
  return 'shell';
}

/* ------------------------------ sprites --------------------------------- */
/* Items are pre-rendered once per resize into hi-res offscreen canvases:
   crisp on retina, cheap to draw every frame, no per-frame shadowBlur. */
const SPR = {};
const SPRITE_SCALE = 3;

function newSprite(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(w));
  c.height = Math.max(2, Math.ceil(h));
  return { c, x: c.getContext('2d') };
}

function buildSprites() {
  for (const key in TYPES) SPR[key] = makeItemSprite(key);
}

function makeItemSprite(key) {
  const t = TYPES[key];
  const rad = t.r * S;
  const pad = rad * 0.75 + 10;
  const size = (rad + pad) * 2;
  const sp = newSprite(size * SPRITE_SCALE, size * SPRITE_SCALE);
  const g = sp.x;
  g.scale(SPRITE_SCALE, SPRITE_SCALE);
  g.translate(rad + pad, rad + pad);   // origin at item centre
  g.lineJoin = 'round'; g.lineCap = 'round';
  drawItemArt(g, key, rad);
  return { img: sp.c, half: rad + pad };
}

function drawItemArt(g, key, r) {
  switch (key) {
    case 'shell': {
      // scallop shell: fan with ridges, hinge at bottom
      const grad = g.createLinearGradient(-r, -r, r, r);
      grad.addColorStop(0, '#fff4e2'); grad.addColorStop(.45, '#ffd9a8'); grad.addColorStop(1, '#f2a06a');
      g.save();
      g.beginPath();
      g.moveTo(0, r * 0.92);
      g.bezierCurveTo(-r * 1.16, r * 0.62, -r * 0.96, -r * 0.72, 0, -r * 0.98);
      g.bezierCurveTo(r * 0.96, -r * 0.72, r * 1.16, r * 0.62, 0, r * 0.92);
      g.closePath();
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(150,78,40,.55)'; g.lineWidth = Math.max(1, r * 0.09); g.stroke();
      g.clip();
      g.strokeStyle = 'rgba(178,96,52,.45)'; g.lineWidth = Math.max(1, r * 0.07);
      for (let i = -2; i <= 2; i++) {
        g.beginPath(); g.moveTo(0, r * 0.9);
        g.lineTo(i * r * 0.52, -r * 1.05);
        g.stroke();
      }
      g.restore();
      // hinge
      g.beginPath(); g.ellipse(0, r * 0.72, r * 0.24, r * 0.19, 0, 0, TAU);
      g.fillStyle = '#e08a55'; g.fill();
      // shine
      g.beginPath(); g.ellipse(-r * 0.34, -r * 0.3, r * 0.2, r * 0.32, -0.5, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.5)'; g.fill();
      break;
    }
    case 'star': {
      const grad = g.createRadialGradient(-r * .2, -r * .3, r * .1, 0, 0, r * 1.2);
      grad.addColorStop(0, '#ffd27a'); grad.addColorStop(.55, '#ff9a3d'); grad.addColorStop(1, '#e8642f');
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 ? r * 0.46 : r * 1.02;
        g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(160,60,20,.5)'; g.lineWidth = Math.max(1, r * .07); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.45)';
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + i * 1.9;
        g.beginPath(); g.arc(Math.cos(a) * r * .45, Math.sin(a) * r * .45, r * .07, 0, TAU); g.fill();
      }
      break;
    }
    case 'fish': {
      const grad = g.createLinearGradient(0, -r, 0, r);
      grad.addColorStop(0, '#7ee8ff'); grad.addColorStop(.5, '#37b6e8'); grad.addColorStop(1, '#1d7fb8');
      // tail
      g.beginPath();
      g.moveTo(r * .62, 0); g.lineTo(r * 1.22, -r * .52); g.lineTo(r * 1.1, 0); g.lineTo(r * 1.22, r * .52);
      g.closePath(); g.fillStyle = '#2a9ed0'; g.fill();
      g.strokeStyle = 'rgba(10,60,90,.45)'; g.lineWidth = Math.max(1, r * .06); g.stroke();
      // body
      g.beginPath(); g.ellipse(0, 0, r * .92, r * .6, 0, 0, TAU);
      g.fillStyle = grad; g.fill(); g.stroke();
      // fin
      g.beginPath(); g.moveTo(-r * .1, -r * .5); g.lineTo(r * .12, -r * .95); g.lineTo(r * .3, -r * .45);
      g.closePath(); g.fillStyle = 'rgba(255,255,255,.35)'; g.fill();
      // stripes
      g.save(); g.beginPath(); g.ellipse(0, 0, r * .92, r * .6, 0, 0, TAU); g.clip();
      g.strokeStyle = 'rgba(255,255,255,.32)'; g.lineWidth = r * .14;
      for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * r * .42 + r * .1, -r); g.lineTo(i * r * .42 - r * .1, r); g.stroke(); }
      g.restore();
      break;
    }
    case 'pearl': {
      const glow = g.createRadialGradient(0, 0, r * .2, 0, 0, r * 1.7);
      glow.addColorStop(0, 'rgba(255,255,255,.55)'); glow.addColorStop(.5, 'rgba(210,235,255,.16)'); glow.addColorStop(1, 'rgba(200,230,255,0)');
      g.beginPath(); g.arc(0, 0, r * 1.7, 0, TAU); g.fillStyle = glow; g.fill();
      const grad = g.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.05);
      grad.addColorStop(0, '#ffffff'); grad.addColorStop(.42, '#ffe9f4'); grad.addColorStop(.7, '#d9e9ff');
      grad.addColorStop(.9, '#b9cdea'); grad.addColorStop(1, '#9aa9cf');
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = grad; g.fill();
      // iridescent sheen band
      g.save();
      g.beginPath(); g.arc(0, 0, r * .98, 0, TAU); g.clip();
      g.beginPath(); g.ellipse(r * .12, r * .3, r * .95, r * .34, -0.35, 0, TAU);
      g.fillStyle = 'rgba(255,205,235,.5)'; g.fill();
      g.beginPath(); g.ellipse(-r * .2, -r * .1, r * .8, r * .28, 0.5, 0, TAU);
      g.fillStyle = 'rgba(190,225,255,.42)'; g.fill();
      g.restore();
      g.beginPath(); g.ellipse(-r * .34, -r * .38, r * .22, r * .15, -0.6, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.95)'; g.fill();
      // sparkle
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = Math.max(1, r * .09);
      g.beginPath(); g.moveTo(r * .72, -r * .82); g.lineTo(r * .72, -r * .38); g.moveTo(r * .5, -r * .6); g.lineTo(r * .94, -r * .6); g.stroke();
      break;
    }
    case 'bubble': {
      const grad = g.createRadialGradient(-r * .3, -r * .35, r * .08, 0, 0, r * 1.05);
      grad.addColorStop(0, 'rgba(255,255,255,.85)'); grad.addColorStop(.35, 'rgba(150,235,255,.35)');
      grad.addColorStop(.85, 'rgba(90,200,255,.28)'); grad.addColorStop(1, 'rgba(180,245,255,.6)');
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = grad; g.fill();
      g.lineWidth = Math.max(1.2, r * .13); g.strokeStyle = 'rgba(220,250,255,.85)'; g.stroke();
      g.beginPath(); g.ellipse(-r * .3, -r * .34, r * .24, r * .15, -0.7, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
      break;
    }
    case 'heart': {
      const grad = g.createLinearGradient(0, -r, 0, r);
      grad.addColorStop(0, '#ff8fa8'); grad.addColorStop(.5, '#ff4d6d'); grad.addColorStop(1, '#d81b46');
      g.beginPath();
      g.moveTo(0, r * .88);
      g.bezierCurveTo(-r * 1.5, -r * .15, -r * .62, -r * 1.15, 0, -r * .42);
      g.bezierCurveTo(r * .62, -r * 1.15, r * 1.5, -r * .15, 0, r * .88);
      g.closePath();
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(150,10,50,.4)'; g.lineWidth = Math.max(1, r * .07); g.stroke();
      g.beginPath(); g.ellipse(-r * .38, -r * .38, r * .19, r * .13, -0.6, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.65)'; g.fill();
      break;
    }
    case 'puffer': {
      // danger: spiky body with angry eyes
      g.beginPath();
      for (let i = 0; i < 24; i++) {
        const a = i / 24 * TAU;
        const rr = i % 2 ? r * 0.72 : r * 1.05;
        g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
      const grad = g.createRadialGradient(-r * .25, -r * .3, r * .1, 0, 0, r * 1.1);
      grad.addColorStop(0, '#ffd76b'); grad.addColorStop(.6, '#e9a83c'); grad.addColorStop(1, '#b06f16');
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(90,50,0,.55)'; g.lineWidth = Math.max(1, r * .08); g.stroke();
      // eyes
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(-r * .3, -r * .12, r * .24, 0, TAU); g.arc(r * .3, -r * .12, r * .24, 0, TAU); g.fill();
      g.fillStyle = '#1b1108';
      g.beginPath(); g.arc(-r * .27, -r * .1, r * .12, 0, TAU); g.arc(r * .33, -r * .1, r * .12, 0, TAU); g.fill();
      // angry brows
      g.strokeStyle = '#3a2408'; g.lineWidth = Math.max(1.4, r * .12);
      g.beginPath(); g.moveTo(-r * .52, -r * .46); g.lineTo(-r * .12, -r * .28); g.stroke();
      g.beginPath(); g.moveTo(r * .52, -r * .46); g.lineTo(r * .12, -r * .28); g.stroke();
      // mouth
      g.beginPath(); g.arc(0, r * .38, r * .22, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      break;
    }
    case 'junk': {
      // plastic bottle drifting in — bad news
      const grad = g.createLinearGradient(-r, 0, r, 0);
      grad.addColorStop(0, 'rgba(190,235,240,.95)'); grad.addColorStop(.5, 'rgba(120,200,215,.85)'); grad.addColorStop(1, 'rgba(70,150,170,.95)');
      g.save();
      g.beginPath(); g.roundRect ? g.roundRect(-r * .52, -r * .62, r * 1.04, r * 1.3, r * .34)
                                 : g.rect(-r * .52, -r * .62, r * 1.04, r * 1.3);
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(30,90,105,.6)'; g.lineWidth = Math.max(1, r * .07); g.stroke();
      g.restore();
      g.beginPath(); g.rect(-r * .26, -r * 1.06, r * .52, r * .46);
      g.fillStyle = 'rgba(160,220,230,.95)'; g.fill(); g.stroke();
      g.beginPath(); g.rect(-r * .34, -r * 1.2, r * .68, r * .2);
      g.fillStyle = '#8a6bd6'; g.fill(); g.stroke();
      g.beginPath(); g.rect(-r * .5, -r * .1, r, r * .34);
      g.fillStyle = 'rgba(255,255,255,.75)'; g.fill();
      g.beginPath(); g.moveTo(-r * .34, -r * .2); g.lineTo(r * .34, r * .3);
      g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = Math.max(1, r * .09); g.stroke();
      break;
    }
  }
}

/* ------------------------------ background ------------------------------ */
const THEMES = [
  { top: '#1a6f9c', mid: '#0f5279', deep: '#083650', sand: '#f2d9a4', sandDark: '#d8b87c', ray: 'rgba(190,240,255,.10)' },
  { top: '#1b6389', mid: '#0d4468', deep: '#062c44', sand: '#efd095', sandDark: '#c9a468', ray: 'rgba(180,235,255,.09)' },
  { top: '#1a527a', mid: '#0a3a5c', deep: '#04223a', sand: '#e8c588', sandDark: '#bd9459', ray: 'rgba(170,225,255,.08)' },
  { top: '#24406e', mid: '#102c52', deep: '#06182f', sand: '#dcb478', sandDark: '#a97f4d', ray: 'rgba(160,205,255,.08)' },
  { top: '#2c2f63', mid: '#161a45', deep: '#080a25', sand: '#c9a173', sandDark: '#8f6b45', ray: 'rgba(150,190,255,.07)' },
  { top: '#32254f', mid: '#1b1436', deep: '#0a0719', sand: '#b8926a', sandDark: '#7a5a3c', ray: 'rgba(190,160,255,.08)' }
];
let TH = THEMES[0];
let backdrop = null;

function makeBackdrop() {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(W * dpr));
  c.height = Math.max(2, Math.round(H * dpr));
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const t = TH;
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, t.top); grad.addColorStop(.45, t.mid); grad.addColorStop(1, t.deep);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  // light shafts from the surface
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const x = (i + 0.5) / 7 * W + rnd(-20, 20);
    const w = rnd(26, 70) * S;
    const lg = g.createLinearGradient(x, 0, x + 40 * S, H);
    lg.addColorStop(0, t.ray); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(x - w / 2, 0); g.lineTo(x + w / 2, 0);
    g.lineTo(x + w * 1.5 + 60 * S, H); g.lineTo(x + w * .5 + 40 * S, H);
    g.closePath(); g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  // far-off rocks / seaweed silhouettes near the sand line
  props = [];
  g.save();
  g.beginPath(); g.rect(0, 0, W, H - sandH + 4 * S); g.clip();
  for (let i = 0; i < 10; i++) {
    const x = rnd(0, W), h = rnd(30, 80) * S, w = rnd(14, 40) * S;
    props.push({ x, w, hk: 0.6 + Math.random() * 1.7, ph: rnd(0, TAU) });
    g.fillStyle = 'rgba(6,32,48,.35)';
    g.beginPath();
    g.moveTo(x - w / 2, H - sandH + 6 * S);
    g.quadraticCurveTo(x - w * .2, H - sandH - h * .8, x, H - sandH - h);
    g.quadraticCurveTo(x + w * .2, H - sandH - h * .8, x + w / 2, H - sandH + 6 * S);
    g.closePath(); g.fill();
  }
  g.restore();

  // sand
  const sg = g.createLinearGradient(0, H - sandH, 0, H);
  sg.addColorStop(0, t.sand); sg.addColorStop(.55, t.sandDark); sg.addColorStop(1, '#a9834f');
  g.fillStyle = sg;
  g.beginPath();
  g.moveTo(0, H - sandH);
  for (let x = 0; x <= W; x += 12) {
    g.lineTo(x, H - sandH + Math.sin(x * 0.021 + 1.3) * 5 * S + Math.sin(x * 0.007) * 4 * S);
  }
  g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();

  // wet sheen + speckles
  g.fillStyle = 'rgba(255,255,255,.10)';
  g.beginPath();
  g.moveTo(0, H - sandH + 3 * S);
  for (let x = 0; x <= W; x += 12) g.lineTo(x, H - sandH + 3 * S + Math.sin(x * 0.021 + 1.3) * 5 * S);
  g.lineTo(W, H - sandH + 12 * S); g.lineTo(0, H - sandH + 12 * S); g.closePath(); g.fill();

  for (let i = 0; i < 140; i++) {
    const x = rnd(0, W), y = rnd(H - sandH + 6 * S, H);
    g.fillStyle = `rgba(${rndi(120, 190)},${rndi(90, 150)},${rndi(50, 110)},${rnd(.06, .18).toFixed(2)})`;
    g.beginPath(); g.arc(x, y, rnd(.6, 1.9) * S, 0, TAU); g.fill();
  }
  backdrop = c;
}

/* decorative rising bubbles (ambient) */
function seedBubbles() {
  bubbles = [];
  const n = clamp(Math.round(W / 90), 5, 16);
  for (let i = 0; i < n; i++) {
    bubbles.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(2, 7) * S, sp: rnd(12, 42) * S, ph: rnd(0, TAU), a: rnd(.06, .22) });
  }
}

/* ------------------------------ particles / popups ---------------------- */
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PART_CAP = reduceMotion ? 60 : 170;

function burst(x, y, color, n, power) {
  if (reduceMotion) n = Math.ceil(n / 2);
  for (let i = 0; i < n && parts.length < PART_CAP; i++) {
    const a = rnd(0, TAU), sp = rnd(.5, 1) * power * S;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30 * S, r: rnd(2, 6) * S, life: rnd(.35, .8), t: 0, c: color, g: 420 * S });
  }
}
function popup(x, y, text, color, size) {
  pops.push({ x, y, text, color: color || '#fff', size: (size || 20) * S, t: 0, life: 0.85 });
}

/* ------------------------------ spawning -------------------------------- */
function spawnItem(type, x, y, fallMul) {
  const t = TYPES[type];
  const speed = clamp(CFG.baseFall * Math.pow(CFG.fallPerLevel, game.level - 1), 0, CFG.maxFall) * S * (fallMul || 1);
  const sway = type === 'fish' || type === 'puffer' || type === 'junk' || type === 'bubble' || type === 'pearl';
  items.push({
    type, x, y, r: t.r * S, vy: speed * rnd(.9, 1.12),
    vx: sway ? rnd(-26, 26) * S : 0, sway: sway ? rnd(1.2, 2.4) : 0, ph: rnd(0, TAU),
    rot: rnd(-0.25, 0.25), spin: sway ? rnd(-.7, .7) : rnd(-.5, .5),
    good: !!t.good, pulse: rnd(0, TAU)
  });
}

function spawnWave() {
  const lvl = game.level;
  const r = Math.random();
  const margin = 34 * S;

  // patterns keep the rhythm varied: singles, pairs, wide arcs, hazard clusters
  if (r < 0.42) {
    spawnItem(rollType(), rnd(margin, W - margin), -40 * S);
  } else if (r < 0.66) {
    const x = rnd(margin + 40 * S, W - margin - 40 * S);
    const gap = rnd(70, 130) * S;
    spawnItem(rollType(), clamp(x - gap, margin, W - margin), -40 * S);
    spawnItem(rollType(), clamp(x + gap, margin, W - margin), -46 * S);
  } else if (r < 0.82) {
    const n = rndi(3, 4), start = rnd(margin, W * 0.4);
    for (let i = 0; i < n; i++) {
      spawnItem(rollType(), clamp(start + i * (W - margin * 2) / (n - 1.1), margin, W - margin), -40 * S - i * 34 * S);
    }
  } else if (r < 0.92) {
    // hazard pair with a safe lane between them
    const lane = rnd(W * .25, W * .75);
    const hazard = lvl >= 2 ? pick(['puffer', 'junk']) : 'shell';
    spawnItem(hazard, clamp(lane - rnd(90, 150) * S, margin, W - margin), -40 * S);
    spawnItem(hazard, clamp(lane + rnd(90, 150) * S, margin, W - margin), -44 * S);
    spawnItem(pick(['shell', 'star', 'fish']), lane, -110 * S, 0.95);
  } else {
    // treasure run — a tempting line of goodies
    const n = rndi(3, 5);
    for (let i = 0; i < n; i++) spawnItem(pick(['shell', 'star', 'fish', 'pearl']), rnd(margin, W - margin), -40 * S - i * 26 * S, 1.05);
  }
}

function nextSpawnDelay() {
  const d = CFG.baseSpawn * Math.pow(CFG.spawnPerLevel, game.level - 1);
  return Math.max(CFG.minSpawn, d) * rnd(0.78, 1.22);
}

/* ------------------------------ game flow ------------------------------- */
function resetGame() {
  items = []; pops = []; parts = [];
  game.score = 0; game.lives = CFG.startLives; game.level = 1;
  game.combo = 0; game.comboTimer = 0; game.bestCombo = 0;
  game.caught = 0; game.elapsed = 0; game.spawnTimer = 0.9;
  game.shake = 0; game.flash = 0; game.banner = null;
  game.shield = 0; game.slowmo = 0; game.newBest = false;
  TH = THEMES[0];
  rebuildWeights();
  makeBackdrop(); seedBubbles(); resetCrab();
  syncHud(true);
}

function startGame() {
  audioUnlock();
  resetGame();
  game.state = 'playing';
  hideOverlay(); $('pauseLayer').classList.remove('on');
  $('hud').classList.add('on'); $('btns').classList.add('on');
  banner('DIVE IN!', 1.1);
  SFX.tap();
}

function gameOver() {
  game.state = 'over';
  if (game.score > game.best) { game.best = game.score; game.newBest = true; }
  store.set('crabby.best', String(game.best));
  $('hud').classList.remove('on'); $('btns').classList.remove('on');
  SFX.over(); buzz([40, 60, 90]);
  showOverlay(menuHTML());
  document.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); startGame(); }, { passive: false }));
}

function pauseGame(silent) {
  if (game.state !== 'playing') return;
  game.state = 'paused';
  $('pauseLayer').classList.add('on');
  if (!silent) SFX.tap();
}
function resumeGame() {
  if (game.state !== 'paused') return;
  game.state = 'playing';
  $('pauseLayer').classList.remove('on');
  last = 0;
}

function banner(text, dur) { game.banner = { text, t: 0, dur: dur || 1.4 }; }

/* ------------------------------ HUD (DOM) ------------------------------- */
let hudCache = {};
function syncHud(force) {
  if (force || hudCache.score !== game.score) { hudCache.score = game.score; $('score').textContent = String(game.score); }
  if (force || hudCache.level !== game.level) { hudCache.level = game.level; $('level').textContent = 'LEVEL ' + game.level; }
  if (force || hudCache.lives !== game.lives) {
    hudCache.lives = game.lives;
    let h = '';
    for (let i = 0; i < CFG.maxLives; i++) h += `<span class="h${i < game.lives ? ' live' : ''}">❤</span>`;
    $('lives').innerHTML = h;
  }
}
function syncCombo() {
  const txt = game.combo >= 3 ? '×' + mult() + '  COMBO ' + game.combo : '';
  if (txt) { $('comboText').textContent = txt; $('comboText').style.transform = 'scale(' + (1 + Math.min(game.combo, 20) * 0.012) + ')'; }
  else $('comboText').textContent = '';
  const on = game.comboTimer > 0 && game.combo >= 3;
  $('comboBarWrap').classList.toggle('on', on);
  if (on) $('comboBar').style.width = Math.max(0, (game.comboTimer / CFG.comboTime) * 100) + '%';
}
const mult = () => clamp(1 + Math.floor(game.combo / 5), 1, 8);

/* ------------------------------ input ----------------------------------- */
let pointerActive = false;
let pointerId = null;

function pointerToWorldX(clientX) {
  const rect = cvs.getBoundingClientRect();
  return clientX - rect.left;
}
function onPointerDown(e) {
  audioUnlock();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointerActive = true; pointerId = e.pointerId;
  if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch (err) {} }
  crab.tx = pointerToWorldX(e.clientX);
  e.preventDefault();
}
function onPointerMove(e) {
  if (!pointerActive || (pointerId !== null && e.pointerId !== pointerId)) return;
  crab.tx = pointerToWorldX(e.clientX);
  e.preventDefault();
}
function onPointerUp(e) {
  if (pointerId !== null && e.pointerId !== pointerId) return;
  pointerActive = false; pointerId = null;
}
cvs.addEventListener('pointerdown', onPointerDown, { passive: false });
cvs.addEventListener('pointermove', onPointerMove, { passive: false });
cvs.addEventListener('pointerup', onPointerUp);
cvs.addEventListener('pointercancel', onPointerUp);
cvs.addEventListener('lostpointercapture', onPointerUp);
// stop iOS double-tap zoom / long-press menus on the play surface
cvs.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

const keys = Object.create(null);
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(k)) e.preventDefault();
  if (k === ' ' || k === 'enter') {
    if (game.state === 'menu' || game.state === 'over') startGame();
    else if (game.state === 'paused') resumeGame();
    else pauseGame();
  }
  if (k === 'escape' || k === 'p') { if (game.state === 'playing') pauseGame(); else if (game.state === 'paused') resumeGame(); }
  if (k === 'm') toggleMute();
  audioUnlock();
}, { passive: false });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* pause when the tab/app goes to the background */
function onHide() { if (game.state === 'playing') pauseGame(true); }
document.addEventListener('visibilitychange', () => { if (document.hidden) onHide(); else last = 0; });
window.addEventListener('blur', onHide);
window.addEventListener('pagehide', onHide);

/* buttons */
$('btnPause').addEventListener('click', () => { audioUnlock(); pauseGame(); });
$('btnResume').addEventListener('click', () => { audioUnlock(); resumeGame(); });
$('btnQuit').addEventListener('click', () => {
  game.state = 'menu';
  $('pauseLayer').classList.remove('on');
  $('hud').classList.remove('on'); $('btns').classList.remove('on');
  resetGame(); showOverlay(menuHTML()); wireMenu();
});
function toggleMute() {
  muted = !muted; store.set('crabby.muted', muted ? '1' : '0');
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (!muted) { audioUnlock(); SFX.tap(); }
}
$('btnMute').addEventListener('click', toggleMute);
$('btnFull').addEventListener('click', () => {
  const el = $('stage');
  if (!document.fullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { try { req.call(el).catch(() => {}); } catch (e) {} }
  } else if (document.exitFullscreen) { document.exitFullscreen().catch(() => {}); }
});

/* overlay plumbing */
const overlay = $('overlay'), panel = $('panel');
function showOverlay(html) { panel.innerHTML = html; overlay.classList.add('on'); }
function hideOverlay() { overlay.classList.remove('on'); panel.innerHTML = ''; }

function legendHTML() {
  return `<div class="legend">
    <i><em>🐚</em>Shell · 10</i>
    <i><em>⭐</em>Starfish · 15</i>
    <i><em>🐟</em>Fish · 25</i>
    <i><em>💎</em>Pearl · 100</i>
    <i><em>🫧</em>Shield bubble</i>
    <i><em>❤️</em>Extra life</i>
    <i><em>🐡</em>Avoid — −1 life</i>
    <i><em>🧴</em>Avoid — −1 life</i>
  </div>`;
}
function menuHTML() {
  const isOver = game.state === 'over';
  return `
    ${isOver ? `<div class="kicker">Game over</div><h2>Nice claws 🦀</h2>` :
      `<div class="kicker">One-thumb arcade</div><h1>CRABBY<br>CATCH</h1>`}
    ${isOver ? `<div class="scorebox">
        <div><b>${game.score}</b><span>SCORE</span></div>
        <div><b>${game.best}</b><span>BEST</span></div>
        <div><b>${game.bestCombo}</b><span>COMBO</span></div>
      </div>` :
      `<p class="sub">Catch the treasure the tide brings in.<br>Dodge the sharp and the plastic.</p>`}
    ${game.newBest && isOver ? `<div class="newbest">★ NEW PERSONAL BEST ★</div>` : ''}
    <button class="btn" data-menu>${isOver ? 'PLAY AGAIN' : 'PLAY'}</button>
    ${legendHTML()}
    <p class="hint">
      ${('ontouchstart' in window) || navigator.maxTouchPoints > 0
        ? 'Drag anywhere on the screen — the crab chases your finger.'
        : 'Drag with the mouse, or steer with ← → / A D.'}
      Pause with the ❚❚ button (auto-pauses if you switch apps).<br>
      Catch goodies in a row to build a combo multiplier up to ×8.
    </p>
    <div class="best">BEST <b>${game.best}</b>${isOver ? '' : ' · sound ' + (muted ? 'OFF' : 'ON')}</div>
  `;
}
function wireMenu() {
  document.querySelectorAll('[data-menu]').forEach(b => {
    b.addEventListener('click', ev => { ev.stopPropagation(); startGame(); }, { passive: false });
    b.addEventListener('pointerup', ev => { ev.stopPropagation(); }, { passive: false });
  });
}

/* ------------------------------ update --------------------------------- */
function update(dt) {
  game.time += dt;

  // ambient bubbles always drift
  for (const b of bubbles) {
    b.y -= b.sp * dt; b.ph += dt * 1.4;
    if (b.y < -20) { b.y = H + 20; b.x = rnd(0, W); }
  }
  stepParticles(dt);

  if (game.state !== 'playing') return;

  game.elapsed += dt;
  const slow = game.slowmo > 0 ? 0.55 : 1;
  game.slowmo = Math.max(0, game.slowmo - dt);
  game.shield = Math.max(0, game.shield - dt);
  game.flash = Math.max(0, game.flash - dt * 3.2);
  game.shake = Math.max(0, game.shake - dt * 26);
  if (game.banner) { game.banner.t += dt; if (game.banner.t > game.banner.dur) game.banner = null; }

  /* --- crab movement --- */
  let target = crab.tx;
  if (keys['arrowleft'] || keys['a']) target = crab.x - 200 * S;
  else if (keys['arrowright'] || keys['d']) target = crab.x + 200 * S;
  if (!pointerActive && !(keys['arrowleft'] || keys['a'] || keys['arrowright'] || keys['d'])) {
    // gently keep the last finger position as the target (direct control feel)
    target = crab.tx;
  }
  const halfW = crabWidth() * 0.5 + 5 * S;
  target = clamp(target, halfW, W - halfW);
  const maxSpeed = 1650 * S;
  const diff = target - crab.x;
  const want = clamp(diff * 11, -maxSpeed, maxSpeed);
  crab.vx = lerp(crab.vx, want, 1 - Math.pow(0.0016, dt));
  crab.x += crab.vx * dt;
  crab.x = clamp(crab.x, halfW, W - halfW);
  crab.tilt = lerp(crab.tilt, clamp(crab.vx / (900 * S), -1, 1), 1 - Math.pow(0.002, dt));
  crab.walk += dt * (6 + Math.abs(crab.vx) / (60 * S));
  crab.snap = Math.max(0, crab.snap - dt * 3.4);
  crab.squash = Math.max(0, crab.squash - dt * 3.6);
  crab.blink -= dt;
  if (crab.blink < -0.1) crab.blink = 0;
  if (crab.blink <= 0 && crab.blink > -0.1) crab.blink = rnd(2.2, 5.5);
  crab.dead = Math.max(0, crab.dead - dt);

  /* --- combo decay --- */
  if (game.combo > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) { game.combo = 0; game.comboTimer = 0; }
  }

  /* --- spawner --- */
  game.spawnTimer -= dt * slow;
  if (game.spawnTimer <= 0 && items.length < 34) {
    spawnWave();
    game.spawnTimer = nextSpawnDelay();
  }

  /* --- items --- */
  const cw = crabWidth() * 0.5, ch = crabHeight() * 0.6;
  const cx = crab.x, cy = crab.y - crabHeight() * 0.16;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.ph += dt * it.sway;
    if (it.sway) it.x += (Math.sin(it.ph) * 26 * S + it.vx) * dt;
    else it.x += it.vx * dt;
    it.y += it.vy * dt * slow;
    it.rot += it.spin * dt;
    if (it.x < 16 * S || it.x > W - 16 * S) it.vx *= -1;

    // catch test: item circle vs crab's basket box
    const hitX = Math.abs(it.x - cx) < cw + it.r * 0.72;
    const hitY = it.y + it.r * 0.7 > cy - ch && it.y - it.r * 0.7 < cy + ch;
    if (hitX && hitY) {
      catchItem(it, i);
      continue;
    }
    // missed / off-screen
    if (it.y - it.r > H + 10 * S) {
      if (it.good) {
        if (game.combo >= 3) popup(it.x, H - sandH - 10 * S, 'MISS', 'rgba(255,255,255,.6)', 13);
        game.combo = 0; game.comboTimer = 0;
        burst(it.x, H - sandH + 4 * S, 'rgba(240,220,170,', 5, 60);
      }
      items.splice(i, 1);
    }
  }

  // crab "looks" at the nearest good item
  let best = null, bd = 1e9;
  for (const it of items) {
    if (!it.good) continue;
    const d = Math.abs(it.x - crab.x) + Math.max(0, crab.y - it.y) * 0.35;
    if (d < bd) { bd = d; best = it; }
  }
  const wantLook = best ? clamp((best.x - crab.x) / (110 * S), -1, 1) : clamp(crab.vx / (700 * S), -1, 1);
  crab.look = lerp(crab.look, wantLook, 1 - Math.pow(0.004, dt));
  crab.y = crabY - Math.abs(Math.min(0, Math.sin(crab.walk * 3))) * 2 * S;

  syncHud(false);
  syncCombo();
}

function crabWidth() { return 96 * S; }
function crabHeight() { return 62 * S; }

function catchItem(it, index) {
  items.splice(index, 1);
  const x = it.x, y = it.y;
  if (it.good) {
    crab.snap = 1; crab.squash = 1;
    const m = mult();
    if (it.type === 'pearl') {
      addScore(TYPES.pearl.pts * m);
      burst(x, y, 'rgba(255,255,255,', 22, 240);
      popup(x, y - 34 * S, '+' + (TYPES.pearl.pts * m), '#eaf7ff', 26);
      game.slowmo = 1.1;               // brief slow-mo: rewards the big grab
      SFX.pearl(); buzz(18);
    } else if (it.type === 'bubble') {
      game.shield = Math.max(game.shield, 8);
      burst(x, y, 'rgba(150,235,255,', 18, 190);
      popup(x, y - 34 * S, 'SHIELD!', '#a9ecff', 20);
      SFX.shield(); buzz(14);
    } else if (it.type === 'heart') {
      if (game.lives < CFG.maxLives) { game.lives++; popup(x, y - 34 * S, '+1 LIFE', '#ff9db0', 20); }
      else { addScore(120 * m); popup(x, y - 34 * S, '+120', '#ff9db0', 20); }
      burst(x, y, 'rgba(255,120,150,', 18, 200);
      SFX.life(); buzz([12, 40, 12]);
    } else {
      addScore(TYPES[it.type].pts * m);
      burst(x, y, 'rgba(255,225,160,', 10, 150);
      popup(x, y - 30 * S, '+' + (TYPES[it.type].pts * m), '#fff3cf', 18);
      SFX.catch(game.combo); buzz(8);
    }
    game.combo++; game.comboTimer = CFG.comboTime;
    game.bestCombo = Math.max(game.bestCombo, game.combo);
    game.caught++;
    if (game.combo === 5 || game.combo === 10 || game.combo === 15 || game.combo % 10 === 0) {
      popup(W / 2, H * 0.36, 'COMBO ×' + mult() + '!', '#ffe066', 26);
    }
    const nextLevel = 1 + Math.floor(game.caught / CFG.catchesPerLevel);
    if (nextLevel > game.level && game.level < CFG.maxLevel) levelUp(nextLevel);
  } else {
    if (game.shield > 0) {
      game.shield = 0;
      burst(x, y, 'rgba(170,240,255,', 26, 260);
      popup(x, y - 34 * S, 'BLOCKED!', '#a9ecff', 22);
      SFX.shield(); buzz(20);
      crab.squash = 1;
      game.combo = Math.max(0, game.combo - 3);
    } else {
      hurt(x, y);
    }
  }
}

function addScore(pts) { game.score += pts; }

function hurt(x, y) {
  game.lives--;
  game.combo = 0; game.comboTimer = 0;
  game.shake = 16; game.flash = 1; game.flashHue = 'rgba(255,70,70,';
  crab.dead = 0.55; crab.squash = 1;
  burst(x, y, 'rgba(255,110,110,', 26, 260);
  popup(crab.x, crab.y - 60 * S, 'OUCH!', '#ff8f8f', 24);
  SFX.hit(); buzz([30, 40, 60]);
  if (game.lives <= 0) { game.lives = 0; syncHud(true); gameOver(); }
  else syncHud(true);
}

function levelUp(next) {
  game.level = clamp(next, 1, CFG.maxLevel);
  rebuildWeights();
  TH = THEMES[clamp(game.level - 1, 0, THEMES.length - 1)];
  makeBackdrop();
  banner('LEVEL ' + game.level + ' — DEEPER', 1.5);
  popup(W / 2, H * 0.46, 'FASTER!', '#ffe066', 22);
  game.shake = 6;
  SFX.level(); buzz([10, 30, 10]);
}

function stepParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985;
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t += dt; p.y -= 46 * S * dt;
    if (p.t >= p.life) pops.splice(i, 1);
  }
}

/* ------------------------------ rendering ------------------------------- */
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sh = game.shake > 0.15 && !reduceMotion ? game.shake : 0;
  if (sh) ctx.translate(rnd(-sh, sh), rnd(-sh, sh) * 0.6);

  // background
  if (backdrop) ctx.drawImage(backdrop, 0, 0, W, H);
  else { ctx.fillStyle = TH.mid; ctx.fillRect(0, 0, W, H); }

  // ambient bubbles
  for (const b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x + Math.sin(b.ph) * 6 * S, b.y, b.r, 0, TAU);
    ctx.fillStyle = 'rgba(220,250,255,' + b.a + ')';
    ctx.fill();
  }

  if (game.state !== 'menu') {
    // water surface shimmer lines
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(180,235,255,.07)';
    ctx.lineWidth = 2 * S;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const off = game.time * (18 + k * 7) * S;
      for (let x = -20; x <= W + 20; x += 16) {
        const y = H * (0.18 + k * 0.09) + Math.sin((x + off) * 0.012 + k) * 9 * S;
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // items
  for (const it of items) {
    const spr = SPR[it.type];
    if (!spr) continue;
    const half = spr.half, size = half * 2;
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot * 0.5);
    if (!it.good) {   // hazards breathe so they read as danger
      const pulse = 1 + Math.sin(game.time * 6 + it.pulse) * 0.05;
      ctx.scale(pulse, pulse);
    } else if (it.type === 'pearl') {
      ctx.globalCompositeOperation = 'lighter';
    }
    ctx.drawImage(spr.img, -half, -half, size, size);
    ctx.restore();
  }

  // particles under the crab
  for (const p of parts) {
    const a = 1 - p.t / p.life;
    ctx.fillStyle = p.c + (a * 0.9).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, TAU); ctx.fill();
  }

  if (game.state !== 'menu') drawCrab();   // on the menu the crab idles behind the overlay

  // score popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pops) {
    const a = 1 - Math.pow(p.t / p.life, 2);
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = '900 ' + p.size.toFixed(1) + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.lineWidth = 4 * S; ctx.strokeStyle = 'rgba(4,20,32,.75)';
    ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }

  // shield aura around the crab
  if (game.state !== 'menu' && game.shield > 0) {
    const fade = game.shield < 1.6 ? (0.35 + 0.65 * Math.abs(Math.sin(game.time * 14))) : 1;
    ctx.save();
    ctx.globalAlpha = 0.55 * fade;
    const rr = crabWidth() * 0.72;
    const g = ctx.createRadialGradient(crab.x, crab.y - 10 * S, rr * 0.4, crab.x, crab.y - 10 * S, rr);
    g.addColorStop(0, 'rgba(180,245,255,0)');
    g.addColorStop(.75, 'rgba(170,240,255,.35)');
    g.addColorStop(1, 'rgba(210,250,255,.85)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(crab.x, crab.y - 10 * S, rr, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // banner text
  if (game.banner) {
    const b = game.banner, k = b.t / b.dur;
    const a = k < 0.16 ? k / 0.16 : k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + (26 * S).toFixed(1) + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.lineWidth = 6 * S; ctx.strokeStyle = 'rgba(3,22,36,.92)';
    ctx.lineJoin = 'round';
    const y = H * 0.3 + Math.sin(k * Math.PI) * -8 * S;
    ctx.strokeText(b.text, W / 2, y);
    const g = ctx.createLinearGradient(0, y - 20 * S, 0, y + 20 * S);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.45, '#fff0b8'); g.addColorStop(1, '#ffb02e');
    ctx.shadowColor = 'rgba(255,190,80,.85)'; ctx.shadowBlur = 18 * S;
    ctx.fillStyle = g; ctx.fillText(b.text, W / 2, y);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // damage flash
  if (game.flash > 0.01) {
    ctx.fillStyle = game.flashHue + (game.flash * 0.3).toFixed(3) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

}

/** One pincer, drawn along +x in local space. */
function clawPath(g, open) {
  const r = 11 * S;
  const grad = g.createLinearGradient(0, -r, r * 1.6, r);
  grad.addColorStop(0, '#f4643c'); grad.addColorStop(1, '#d1361c');
  g.lineJoin = 'round';
  g.fillStyle = grad; g.strokeStyle = 'rgba(115,22,8,.6)'; g.lineWidth = Math.max(1.2, 2.2 * S);
  // upper pincer
  g.beginPath();
  g.moveTo(-r * 0.3, -r * 0.16);
  g.quadraticCurveTo(r * 0.8, -r * (0.72 + open), r * 1.42, -r * 0.12);
  g.quadraticCurveTo(r * 0.88, -r * 0.04, -r * 0.3, r * 0.02);
  g.closePath(); g.fill(); g.stroke();
  // lower pincer
  g.beginPath();
  g.moveTo(-r * 0.3, r * 0.16);
  g.quadraticCurveTo(r * 0.8, r * (0.72 + open), r * 1.42, r * 0.12);
  g.quadraticCurveTo(r * 0.88, r * 0.04, -r * 0.3, -r * 0.02);
  g.closePath(); g.fill(); g.stroke();
  // knuckle
  g.beginPath(); g.ellipse(-r * 0.1, 0, r * 0.34, r * 0.3, 0, 0, TAU);
  g.fillStyle = '#e0532f'; g.fill(); g.stroke();
  // highlight
  g.beginPath(); g.ellipse(r * 0.35, -r * 0.42, r * 0.16, r * 0.09, -0.3, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fill();
}

function drawCrab() {
  const w = crabWidth(), h = crabHeight();
  const hurtNow = crab.dead > 0;
  const squash = 1 + crab.squash * 0.14;
  const snap = crab.snap;

  // contact shadow on the sand
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#3d2708';
  ctx.beginPath(); ctx.ellipse(crab.x, crab.y + h * 0.46, w * 0.46, h * 0.14, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(crab.x, crab.y);
  ctx.rotate(crab.tilt * 0.12);
  ctx.scale(crab.tilt >= 0 ? 1 : -1, 1);        // face the direction of travel
  if (hurtNow) ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(game.time * 22));

  /* ---- walking legs (three per side, out from under the shell) ---- */
  const legPhase = Math.sin(crab.walk * 3) * 3.5 * S;
  ctx.strokeStyle = '#b8351c';
  ctx.lineWidth = Math.max(2.2, 3.8 * S);
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const spread = (i - 1) * 0.42;
    for (const s of [-1, 1]) {
      const ph = legPhase * (i % 2 ? 1 : -1) * (s > 0 ? 1 : -0.8);
      const kx = s * w * (0.5 + i * 0.045), ky = h * (0.1 + spread * 0.22) + ph;
      ctx.beginPath();
      ctx.moveTo(s * w * 0.34, h * (0.12 + spread * 0.16));
      ctx.quadraticCurveTo(kx, ky, s * w * (0.6 + i * 0.05), h * (0.44 + spread * 0.1) + ph * 0.7);
      ctx.stroke();
    }
  }

  /* ---- arms + raised claws (drawn before the shell so the joint hides) ---- */
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * w * 0.42, h * 0.06);
    ctx.scale(s, 1);
    const tipX = w * 0.22 + 4 * S;
    const tipY = -h * 0.5 - snap * 9 * S;
    ctx.strokeStyle = '#d2452a';
    ctx.lineWidth = Math.max(2.6, 6 * S);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-w * 0.06, h * 0.08);
    ctx.quadraticCurveTo(w * 0.12, -h * 0.2, tipX, tipY);
    ctx.stroke();
    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(-0.22 - snap * 0.3);
    clawPath(ctx, 0.06 + snap * 0.5);
    ctx.restore();
    ctx.restore();
  }

  /* ---- shell ---- */
  ctx.save();
  ctx.scale(squash, 2 - squash);
  const bg = ctx.createLinearGradient(0, -h * 0.9, 0, h * 0.5);
  bg.addColorStop(0, '#ff9a63'); bg.addColorStop(.42, '#ef4f2a'); bg.addColorStop(1, '#bd2c14');
  ctx.beginPath();
  ctx.moveTo(-w * 0.48, h * 0.26);
  ctx.bezierCurveTo(-w * 0.59, -h * 0.3, -w * 0.31, -h * 0.84, 0, -h * 0.84);
  ctx.bezierCurveTo(w * 0.31, -h * 0.84, w * 0.59, -h * 0.3, w * 0.48, h * 0.26);
  ctx.bezierCurveTo(w * 0.3, h * 0.56, -w * 0.3, h * 0.56, -w * 0.48, h * 0.26);
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth = Math.max(1.6, 2.8 * S); ctx.strokeStyle = 'rgba(112,20,8,.5)'; ctx.stroke();

  // shell speckles + a soft top sheen
  ctx.globalAlpha *= 0.55;
  ctx.fillStyle = '#ffd6b0';
  ctx.beginPath(); ctx.arc(-w * 0.2, -h * 0.3, 4 * S, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.15, -h * 0.46, 3.1 * S, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.3, -h * 0.1, 3.5 * S, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-w * 0.34, -h * 0.02, 2.7 * S, 0, TAU); ctx.fill();
  ctx.globalAlpha /= 0.55;
  ctx.beginPath();
  ctx.ellipse(-w * 0.14, -h * 0.52, w * 0.2, h * 0.14, -0.35, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();

  // happy mouth when a combo is rolling
  if (game.combo >= 5) {
    ctx.beginPath();
    ctx.arc(0, h * 0.02, 7.5 * S, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.strokeStyle = 'rgba(70,16,6,.75)'; ctx.lineWidth = Math.max(1.4, 2.6 * S);
    ctx.lineCap = 'round'; ctx.stroke();
  }

  /* ---- eye stalks + eyes (pupils track the nearest treat) ---- */
  const look = crab.look;
  for (const s of [-1, 1]) {
    const ex = s * w * 0.19, ey = -h * 0.92;
    ctx.strokeStyle = '#e0532f'; ctx.lineWidth = Math.max(2, 4 * S);
    ctx.beginPath();
    ctx.moveTo(s * w * 0.13, -h * 0.66);
    ctx.quadraticCurveTo(s * w * 0.18, -h * 0.86, ex, ey);
    ctx.stroke();
    const eyeR = 10.5 * S;
    const blink = crab.blink <= 0 && crab.blink > -0.13;
    ctx.beginPath(); ctx.arc(ex, ey - 2 * S, eyeR, 0, TAU);
    ctx.fillStyle = '#fffdf6'; ctx.fill();
    ctx.lineWidth = Math.max(1.2, 2 * S); ctx.strokeStyle = 'rgba(120,30,15,.45)'; ctx.stroke();
    if (!blink) {
      ctx.beginPath();
      ctx.arc(ex + look * eyeR * 0.4, ey - 2 * S + eyeR * 0.1, eyeR * 0.44, 0, TAU);
      ctx.fillStyle = '#20120c'; ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + look * eyeR * 0.4 - eyeR * 0.19, ey - 2 * S - eyeR * 0.2, eyeR * 0.15, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    } else {
      ctx.strokeStyle = '#20120c'; ctx.lineWidth = Math.max(1.4, 2.4 * S); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - eyeR * .65, ey - 2 * S); ctx.lineTo(ex + eyeR * .65, ey - 2 * S); ctx.stroke();
    }
  }
  ctx.restore();   // shell scale
  ctx.restore();   // crab transform
}

/* ------------------------------ main loop ------------------------------- */
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!last) last = t;
  let dt = (t - last) / 1000;
  last = t;
  if (dt > 0.25) dt = 0.25;           // tab-switch guard
  dt = Math.min(dt, 1 / 30);          // clamp for stability on slow frames
  update(dt);
  render();
}

/* ------------------------------ boot ------------------------------------ */
resize();
seedBubbles();
resetGame();
game.state = 'menu';
$('btnMute').textContent = muted ? '🔇' : '🔊';
showOverlay(menuHTML());
wireMenu();

// first touch/click anywhere unlocks audio (iOS requires a user gesture)
overlay.addEventListener('pointerdown', e => {
  audioUnlock();
  // tapping the dim area outside the card also kicks off a run
  if (e.target === overlay && (game.state === 'menu' || game.state === 'over')) startGame();
}, { passive: true });
cvs.addEventListener('pointerdown', () => {
  if (game.state === 'menu') startGame();
}, { passive: true });

// re-check size once fonts/layout settle (mobile URL bar)
setTimeout(resize, 120);
setTimeout(resize, 600);

// expose a tiny debug handle (handy, harmless)
window.CrabbyCatch = {
  get state() { return game.state; },
  get score() { return game.score; },
  start: startGame, pause: pauseGame, resume: resumeGame,
  _debug: { game, crab, items: () => items, spawnWave, catchItem: () => catchItem, hurt }
};

requestAnimationFrame(frame);
})();
</script>
</body>
