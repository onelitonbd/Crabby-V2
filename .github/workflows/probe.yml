# Temporary probe: checks which public static hosts serve the game as real HTML.
# Manual dispatch only; deleted once a host is verified.
name: probe static hosts
on:
  push:
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump headers for the working host
        run: |
          U="https://raw.githack.com/onelitonbd/Crabby-V2/arena/b489e0b2-crabby-v2/games/crabby-catch.html"
          curl -s -D /tmp/h -o /tmp/b -L --max-time 25 "$U" >/dev/null
          echo "::notice title=HDRS::$(grep -iE '^(HTTP/|content-type|content-security|x-frame|content-disposition|x-content-type|cross-origin|server)' /tmp/h | tr -d '\r' | paste -sd' ; ' -)"
          echo "::notice title=BODYCHK::bytes=$(wc -c < /tmp/b | tr -d ' ') hasCanvas=$(grep -c 'canvas id=\"game\"' /tmp/b) hasInlineScript=$(grep -c 'Crabby Catch — a single-file' /tmp/b)"
