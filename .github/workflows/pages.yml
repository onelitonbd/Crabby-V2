# Publishes the games/ folder to GitHub Pages so Crabby Catch has a public,
# phone-friendly URL: https://onelitonbd.github.io/Crabby-V2/
#
# This workflow enables Pages (the session's API token can't do that directly)
# and deploys a static artifact — no build step, no dependencies.
name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - arena/b489e0b2-crabby-v2
    paths:
      - 'games/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the games folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./games

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
